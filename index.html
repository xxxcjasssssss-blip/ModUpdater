<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محدث مودات ماينكرافت التلقائي</title>
    <style>
        :root {
            --bg-color: #1e1f29;
            --card-bg: #2b2d3c;
            --drop-bg: #222431;
            --border-color: #4cd964;
            --text-color: #e0e0e0;
            --text-sub: #a0a0a0;
            --input-bg: #181922;
            --btn-bg: #90ee90;
            --btn-hover: #7ccd7c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .header p {
            color: var(--text-sub);
            margin: 0;
            font-size: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .drop-zone {
            border: 2px dashed #556b2f;
            border-radius: 8px;
            background-color: var(--drop-bg);
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .drop-zone:hover {
            border-color: var(--border-color);
        }

        .drop-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }

        .drop-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .drop-sub {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 15px;
        }

        .browse-btn {
            background-color: #3b3e52;
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid #333547;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--btn-bg);
            color: #11111b;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--btn-hover);
        }

        .file-count {
            margin-top: 8px;
            font-size: 12px;
            color: var(--border-color);
        }

        #progress-container {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            background-color: var(--input-bg);
            border-radius: 6px;
            overflow: hidden;
            height: 10px;
            margin-top: 8px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: var(--border-color);
            transition: width 0.3s;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ محدث مودات ماينكرافت التلقائي</h1>
        <p>اسحب موداتك (.jar) وارمها هنا لتحديثها للإصدار والمنصة المطلوبة فوراً!</p>
    </div>

    <div class="card">
        <form id="upload-form">
            <div class="drop-zone">
                <span class="drop-icon">📦</span>
                <div class="drop-title">اسحب ملفات المودات هنا</div>
                <div class="drop-sub">يمكنك رمي كل ملفات الـ .jar أو ملف ZIP دفعة واحدة</div>
                <button type="button" class="browse-btn">تصفح الملفات</button>
                <!-- تمت إضافة name="mods" هنا -->
                <input type="file" name="mods" id="mods-input" class="file-input" multiple accept=".jar,.zip" required onchange="showFileCount(this)">
                <div id="file-count" class="file-count"></div>
            </div>

            <div class="form-group">
                <label>إصدار اللعبة المستهدف:</label>
                <!-- تمت إضافة name="version" هنا -->
                <input type="text" name="version" id="version-input" class="form-control" value="1.21" required>
            </div>

            <div class="form-group">
                <label>اختر المنصة (Loader):</label>
                <!-- تمت إضافة name="loader" هنا -->
                <select name="loader" id="loader-input" class="form-control" required>
                    <option value="fabric" selected>Fabric</option>
                    <option value="forge">Forge</option>
                    <option value="neoforge">NeoForge</option>
                    <option value="quilt">Quilt</option>
                </select>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">
                🚀 تحديث وتحميل المودات
            </button>

            <div id="progress-container">
                <div id="progress-text" style="font-size: 13px; color: var(--border-color);">جاري معالجة وتحديث المودات...</div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </form>
    </div>

    <script>
        function showFileCount(input) {
            const countDiv = document.getElementById('file-count');
            if (input.files && input.files.length > 0) {
                countDiv.textContent = `تم اختيار ${input.files.length} ملف مود`;
            } else {
                countDiv.textContent = '';
            }
        }

        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const files = document.getElementById('mods-input').files;
            const version = document.getElementById('version-input').value;
            const loader = document.getElementById('loader-input').value;

            if (files.length === 0) return;

            const btn = document.getElementById('submit-btn');
            const progressContainer = document.getElementById('progress-container');
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');

            btn.disabled = true;
            btn.style.opacity = '0.7';
            progressContainer.style.display = 'block';
            progressFill.style.width = '30%';
            progressText.textContent = `جاري إرسال ${files.length} مود للمعالجة...`;

            const formData = new FormData(this);

            try {
                progressFill.style.width = '60%';
                const response = await fetch('/update-mods', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    progressFill.style.width = '100%';
                    progressText.textContent = 'تم التحديث بنجاح! جاري تحميل الملفات...';
                    
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `updated_mods_${version}_${loader}.zip`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        progressContainer.style.display = 'none';
                        progressFill.style.width = '0%';
                    }, 2000);
                } else {
                    const errText = await response.text();
                    alert('خطأ من السيرفر: ' + errText);
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    progressContainer.style.display = 'none';
                }
            } catch (err) {
                alert('حدث خطأ في الاتصال بالسيرفر.');
                btn.disabled = false;
                btn.style.opacity = '1';
                progressContainer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
